services:
  mindustry-server:
    build: .
    container_name: mindustry-server
    restart: unless-stopped
    ports:
      - "6567:6567/tcp"
      - "6567:6567/udp"
    volumes:
      # 持久化游戏数据（地图、配置、存档、模组）
      - ./data:/app/config
    environment:
      # 可选：设置 Java 堆内存大小（根据服务器配置调整）
      - JAVA_OPTS=-Xmx2G -Xms512M
    # 覆盖入口点以支持 JAVA_OPTS 环境变量
    entrypoint: ["/sbin/tini", "--", "sh", "-c", "java $JAVA_OPTS -jar server.jar headless"]
    # 允许容器内进程接收 SIGTERM 信号，实现优雅关闭
    stop_grace_period: 30s
