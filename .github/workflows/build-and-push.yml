name: 每日构建并推送 Mindustry 服务器镜像

# 触发条件：
# 1. 每天 UTC 时间 0:00 自动运行（北京时间 8:00）
# 2. 支持手动触发（可在 GitHub 仓库 Actions 页面点击运行）
# 3. 可选：当 Dockerfile 变更时自动触发
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - Dockerfile

# 权限配置
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 允许构建失败重试 1 次
    strategy:
      fail-fast: false
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 QEMU（用于多架构构建）
        uses: docker/setup-qemu-action@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 获取 Mindustry 最新版本号
        id: get-version
        run: |
          # 调用 GitHub API 获取最新正式版标签（排除预发布）
          MINDUSTRY_VERSION=$(curl -sSL https://api.github.com/repos/Anuken/Mindustry/releases/latest | jq -r '.tag_name')
          echo "MINDUSTRY_VERSION=$MINDUSTRY_VERSION" >> $GITHUB_ENV
          echo "SERVER_DOWNLOAD_URL=https://github.com/Anuken/Mindustry/releases/download/${VERSION}/server-release.jar" >> $GITHUB_ENV; \
          echo "CLIENT_DOWNLOAD_URL=https://github.com/Anuken/Mindustry/releases/download/${VERSION}/Mindustry.jar" >> $GITHUB_ENV; \
          echo "最新版本: $MINDUSTRY_VERSION"
          echo "服务端链接: $SERVER_DOWNLOAD_URL"; \
          echo "客户端链接: $CLIENT_DOWNLOAD_URL"; \

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          # 同时构建 AMD64 和 ARM64
          platforms: linux/amd64,linux/arm64
          push: true
          # 镜像标签：latest + 具体版本号（如 v146）
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/mindustry-server:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/mindustry-server:${{ env.MINDUSTRY_VERSION }}
          # 启用缓存加速构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 添加构建元数据
          labels: |
            org.opencontainers.image.title=Mindustry Server
            org.opencontainers.image.description=每日自动更新的 Mindustry 游戏服务器镜像
            org.opencontainers.image.version=${{ env.MINDUSTRY_VERSION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: 自动更新 README.md 客户端链接
        run: |
          # 检查 README.md 是否存在
          if [ ! -f README.md ]; then
              echo "README.md 不存在，创建默认模板"
              echo "version: $MINDUSTRY_VERSION" > README.md
              echo "[compose file](./docker-compose.yml)" > README.md
              echo "[game server](${SERVER_DOWNLOAD_URL})" >> README.md
              echo "[game client](${CLIENT_DOWNLOAD_URL})" >> README.md
          else
              # 使用 sed 替换已有的链接（精确匹配格式）
              sed -i "s|version(.*)|version: (${MINDUSTRY_VERSION})|g" README.md
              sed -i "s|\[game server\](.*)|\[game server\](${SERVER_DOWNLOAD_URL})|g" README.md
              sed -i "s|\[game client\](.*)|\[game client\](${CLIENT_DOWNLOAD_URL})|g" README.md
              # 如果替换失败（没有找到匹配行），则追加到文件末尾
              if ! grep -q "version" README.md; then
                  echo "" >> README.md
                  echo "version: (${MINDUSTRY_VERSION})" >> README.md
              fi
              if ! grep -q "\[game server\]" README.md; then
                  echo "" >> README.md
                  echo "[game server](${SERVER_DOWNLOAD_URL})" >> README.md
              fi
              if ! grep -q "\[game client\]" README.md; then
                  echo "" >> README.md
                  echo "[game client](${CLIENT_DOWNLOAD_URL})" >> README.md
              fi
          fi

          # 配置 Git 提交信息（使用 GitHub Actions 机器人身份）
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 检查是否有变化，避免空提交
          if git diff --quiet README.md; then
              echo "README.md 无变化，无需提交"
              exit 0
          fi

          # 提交并推送修改
          git add README.md
          git commit -m "自动更新服务端、客户端链接至版本 ${MINDUSTRY_VERSION}"
          git push origin main

      - name: 清理构建缓存
        if: always()
        run: docker builder prune -f

  # 清除旧的workflow运行记录
  cleanup-workflow-runs:
    runs-on: ubuntu-latest
    steps:
      - name: 删除旧 Actions
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.CLEANUP_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
